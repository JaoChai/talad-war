name: security

# Security layer 2: automatic secret + dependency scans.
# Scans only - never deploys, never uses secrets, never edits code.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, Mondays 02:23 UTC (avoid the top-of-hour rush).
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install gitleaks v8.30.1 (official release, checksum-verified)
        run: |
          cd "$(mktemp -d)"
          curl --silent --show-error --location --fail --retry 3 \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --silent --show-error --location --fail --retry 3 \
            -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full git history (redacted)
        run: gitleaks git . --redact --verbose

  deps:
    name: npm audit (runtime deps, high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (scripts disabled)
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies (fails on HIGH/CRITICAL)
        run: npm audit --omit=dev --audit-level=high
